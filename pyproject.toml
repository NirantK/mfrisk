[project]
name = "mfrisk"
version = "0.1.0"
description = "Risk-adjusted ranking of Indian mutual funds (Sortino, Ulcer/Pain Index, Martin) over rolling windows, with a local HTMX microsite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "NirantK" }]
keywords = ["mutual-funds", "india", "sortino", "ulcer-index", "amfi", "mfapi"]

dependencies = [
    "httpx[http2]>=0.27",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "tenacity>=8.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mfrisk = "mfrisk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"
